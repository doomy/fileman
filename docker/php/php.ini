; FileMan backend - PHP-FPM runtime overrides

date.timezone = UTC
expose_php = Off

; Keep these aligned with MAX_FILE_SIZE in .env
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

memory_limit = 256M
max_execution_time = 60

; OPcache
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

display_errors = Off
log_errors = On
error_log = /dev/stderr
